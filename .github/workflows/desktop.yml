name: Desktop app

# The Hildegard app (apps/desktop), built on each OS and kept as workflow artifacts to download and try. It makes no
# release or tag itself; release.yml calls it for a tagged release. The bundles aren't signed yet: see "The Hildegard
# app" in the README.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  # Its own group when release.yml calls it, so main's app build and the release's never cancel each other.
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          # The oldest Ubuntu runner, so the AppImage and .deb run on older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, the history upstream says to pin
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: WebKitGTK and the tray library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libxdo-dev patchelf file
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hildegard/desktop typecheck
      - run: pnpm --filter @hildegard/desktop test
      - run: pnpm --filter @hildegard/studio build
      - name: Hildegard and Node.js for the app to carry
        run: node apps/desktop/scripts/prepare-bundle.mjs --target ${{ matrix.target }}
      # The start-up page and the files above are compiled in, so the Rust tests come after them.
      - run: pnpm --filter @hildegard/desktop build
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      # Signs the files the app's updater installs. Without the key (a fork's PR), it builds the app unsigned.
      - name: Build the app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          unsigned=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No updater signing key here, so this build can't update itself."
            unsigned=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${unsigned[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hildegard-app-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/*/*.sig
          if-no-files-found: error
          retention-days: 14
